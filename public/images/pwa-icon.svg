<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de Fundo Principal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1730"/>
      <stop offset="40%" stop-color="#081022"/>
      <stop offset="100%" stop-color="#020713"/>
    </linearGradient>

    <!-- Gradiente do Escudo Central -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Gradiente de Brilho / Neon -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Sombra Elegante -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo com Cantos Squircle Arredondados -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Borda Sutil Externa com Brilho Superior -->
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-opacity="0.4"/>
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08"/>

  <!-- Grade de Circuito / Rede em Fundo Sutil -->
  <g stroke="#38bdf8" stroke-opacity="0.07" stroke-width="2">
    <line x1="80" y1="140" x2="432" y2="140"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="80" y1="372" x2="432" y2="372"/>
    <line x1="140" y1="80" x2="140" y2="432"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <line x1="372" y1="80" x2="372" y2="432"/>
  </g>

  <!-- Brilho de Fundo Circular Central -->
  <circle cx="256" cy="240" r="150" fill="#0284c7" opacity="0.18" filter="url(#glow)"/>

  <!-- Emblema Central em Hexágono / Rack Shield -->
  <g filter="url(#softGlow)">
    <!-- Forma do Escudo Central -->
    <path d="M 256,96 L 396,176 L 396,336 L 256,416 L 116,336 L 116,176 Z" 
          fill="#0c172d" stroke="url(#accentGrad)" stroke-width="4"/>
    <path d="M 256,114 L 380,186 L 380,326 L 256,398 L 132,326 L 132,186 Z" 
          fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
  </g>

  <!-- Nós de Conexão de Rede nos Vértices -->
  <circle cx="256" cy="96" r="8" fill="#38bdf8"/>
  <circle cx="396" cy="176" r="8" fill="#38bdf8"/>
  <circle cx="396" cy="336" r="8" fill="#38bdf8"/>
  <circle cx="256" cy="416" r="8" fill="#38bdf8"/>
  <circle cx="116" cy="336" r="8" fill="#38bdf8"/>
  <circle cx="116" cy="176" r="8" fill="#38bdf8"/>

  <!-- Linhas de Roteamento / Viga Tecnológica -->
  <path d="M 160,256 L 210,256 L 256,200 L 302,256 L 352,256" 
        fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Monograma Central MT com Estilo Tipográfico Robusto -->
  <g fill="#ffffff">
    <!-- Letra M -->
    <path d="M 172,300 L 172,190 L 198,190 L 224,248 L 250,190 L 276,190 L 276,300 L 252,300 L 252,232 L 232,278 L 216,278 L 196,232 L 196,300 Z" 
          fill="url(#shieldGrad)"/>
    <path d="M 172,300 L 172,190 L 198,190 L 224,248 L 250,190 L 276,190 L 276,300 L 252,300 L 252,232 L 232,278 L 216,278 L 196,232 L 196,300 Z" 
          fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>

    <!-- Letra T -->
    <path d="M 284,214 L 284,190 L 348,190 L 348,214 L 328,214 L 328,300 L 304,300 L 304,214 Z" 
          fill="url(#accentGrad)"/>
    <path d="M 284,214 L 284,190 L 348,190 L 348,214 L 328,214 L 328,300 L 304,300 L 304,214 Z" 
          fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
  </g>

  <!-- Tag RouterOS v7 Inferior -->
  <g>
    <rect x="186" y="344" width="140" height="26" rx="13" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- LED Indicador Verde Operacional -->
    <circle cx="206" cy="357" r="4" fill="#10b981"/>
    <circle cx="206" cy="357" r="7" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
    <text x="256" y="361" text-anchor="middle" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
      ROUTEROS v7
    </text>
  </g>

  <!-- Texto ACADEMIA Superior Discreto -->
  <text x="256" y="152" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#94a3b8" letter-spacing="4">
    ACADEMIA
  </text>
</svg>

