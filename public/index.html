<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Academia Técnica MikroTik — Capacitação Profissional ISP</title>
  <meta name="description" content="Plataforma corporativa de capacitação técnica profissional em MikroTik RouterOS para equipes de engenharia, suporte e operações de provedores de internet.">
  
  <!-- PWA & Mobile Web App Manifest -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0284c7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Academia MT">
  <link rel="apple-touch-icon" href="./images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./images/pwa-icon-192.png">
  <link rel="icon" type="image/svg+xml" href="./images/pwa-icon.svg">
  
  <!-- Fontes Corporativas Modernas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos da Plataforma -->
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/modules.css">
  <link rel="stylesheet" href="./css/winbox.css">
  <link rel="stylesheet" href="./css/terminal.css">
  <link rel="stylesheet" href="./css/lab.css">
  <link rel="stylesheet" href="./css/quiz.css">
  <link rel="stylesheet" href="./css/admin.css">
  <link rel="stylesheet" href="./css/certificate.css">

  <script>
    // Detecção precoce de abertura via file:// ou Live Server fora da porta 3000
    if (window.location.protocol === 'file:') {
      window.addEventListener('DOMContentLoaded', function() {
        var app = document.getElementById('app');
        if (app) {
          app.innerHTML = '<div style="display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:100vh; background:#070b14; color:#f8fafc; font-family:\'Inter\', -apple-system, sans-serif; padding:24px; text-align:center;">' +
            '<div style="background:#0f172a; border:1px solid #1e293b; border-radius:12px; padding:36px; max-width:560px; box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">' +
              '<div style="font-size:36px; margin-bottom:12px;">⚠️</div>' +
              '<h2 style="font-size:22px; font-weight:700; margin-bottom:12px; color:#38bdf8;">Aplicação Aberta em Modo Arquivo (file://)</h2>' +
              '<p style="color:#94a3b8; font-size:14px; line-height:1.6; margin-bottom:24px;">' +
                'A <strong>Academia Técnica MikroTik</strong> é uma plataforma fullstack com simuladores de RouterOS e banco de dados SQLite. Ela requer o servidor Node.js ativo e não pode ser executada por duplo clique em arquivos locais.' +
              '</p>' +
              '<div style="background:#020617; border:1px solid #334155; border-radius:8px; padding:16px; font-family:\'JetBrains Mono\', monospace; font-size:13px; color:#4ade80; margin-bottom:24px; text-align:left;">' +
                '<span style="color:#64748b;"># 1. No terminal do VS Code / Antigravity, execute:</span><br>' +
                '<strong style="color:#38bdf8; font-size:15px;">npm start</strong><br><br>' +
                '<span style="color:#64748b;"># 2. Acesse no navegador:</span><br>' +
                '<strong style="color:#f8fafc;">http://localhost:3000</strong>' +
              '</div>' +
            '</div>' +
          '</div>';
        }
      });
    }
  </script>
</head>
<body>
  <div id="app">
    <!-- O App Shell será injetado dinamicamente via app.js -->
    <div style="display:flex; justify-content:center; align-items:center; height:100vh; background:#070b14; color:#38bdf8; font-family:'JetBrains Mono', monospace; font-size:14px;">
      Inicializando Academia Técnica MikroTik RouterOS...
    </div>
  </div>

  <!-- Script Modular ES6 -->
  <script type="module" src="./js/app.js"></script>

  <!-- Fallback de Segurança contra Cache Preso em Celulares e GitHub Pages -->
  <script>
    setTimeout(function() {
      var app = document.getElementById('app');
      if (app && app.innerHTML.includes('Inicializando Academia Técnica')) {
        console.warn('[Recuperação] Timeout de inicialização detectado. Oferecendo limpeza de cache.');
        app.innerHTML = '<div style="display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:100vh; background:#070b14; color:#f8fafc; font-family:\'Inter\', -apple-system, sans-serif; padding:20px; text-align:center;">' +
          '<div style="background:#0f172a; border:1px solid #1e293b; border-radius:12px; padding:32px; max-width:440px; box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">' +
            '<div style="font-size:36px; margin-bottom:12px;">⚡</div>' +
            '<h3 style="font-size:18px; font-weight:700; color:#38bdf8; margin-bottom:8px;">Academia Técnica MikroTik</h3>' +
            '<p style="color:#94a3b8; font-size:13px; line-height:1.5; margin-bottom:20px;">' +
              'Detectamos uma atualização recente da plataforma. Clique abaixo para carregar a versão mais recente em seu dispositivo:' +
            '</p>' +
            '<button onclick="if(\'caches\' in window){caches.keys().then(function(keys){return Promise.all(keys.map(function(k){return caches.delete(k);}));}).then(function(){location.reload(true);});}else{location.reload(true);}" style="background:#0284c7; color:#fff; border:none; padding:12px 24px; border-radius:8px; font-weight:600; font-size:14px; cursor:pointer; width:100%; box-shadow:0 4px 12px rgba(2,132,199,0.3);">' +
              'Carregar Versão Atualizada' +
            '</button>' +
          '</div>' +
        '</div>';
      }
    }, 4500);
  </script>

  <!-- Registro do PWA Service Worker com Atualização Imediata -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) {
            console.log('[PWA] Service Worker registrado! Escopo:', reg.scope);
            // Força checagem de nova versão imediatamente
            reg.update();
          })
          .catch(function(err) {
            console.info('[PWA] Service Worker não registrado neste host:', err.message);
          });
      });
    }
  </script>
</body>
</html>
